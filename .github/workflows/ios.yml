name: ios
on:
  workflow_dispatch:
    inputs:
      clips:
        description: "Comma list: camera,add-to-home"
        default: "camera,add-to-home"
      runner:
        description: "GitHub-hosted macOS runner"
        type: choice
        options: [macos-26, macos-26-intel, macos-15-intel, xcode-27, macos-15]
        default: macos-26
      device:
        description: "Simulator device type"
        default: "iPhone 17"
      runtime:
        description: "iOS runtime version prefix, empty = newest on the runner"
        default: ""
      publish:
        description: "Commit the rendered clips to clips/"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen
      - name: Record on the simulator
        env:
          GUIDE_CLIPS: ${{ inputs.clips }}
          IOS_DEVICE: ${{ inputs.device }}
          IOS_RUNTIME: ${{ inputs.runtime }}
        run: python3 ios/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-raw
          path: out/raw
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-debug
          path: out/debug
          retention-days: 14

  process:
    needs: record
    runs-on: ubuntu-latest
    env:
      GUIDE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-raw
          path: out/raw
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Render clips
        run: python3 tools/process.py out/raw out/clips
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-clips
          path: out/clips
          retention-days: 30

  publish:
    needs: process
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-clips
          path: out/clips
      - run: tools/publish.sh out/clips
